{% extends "base.html" %}

{% block title %}Reset password | {{ site_name }}{% endblock %}

{% block content %}
<section class="page-width auth-page">
    <div class="auth-card">
        <p class="eyebrow">Password reset</p>
        <h1>Reset your password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button button-dark" type="submit">Send reset email</button>
        </form>
    </div>
</section>
{% endblock %}
