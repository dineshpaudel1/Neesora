{% extends "base.html" %}

{% block title %}Choose a new password | {{ site_name }}{% endblock %}

{% block content %}
<section class="page-width auth-page">
    <div class="auth-card">
        <p class="eyebrow">New password</p>
        <h1>Set a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button button-dark" type="submit">Save new password</button>
        </form>
    </div>
</section>
{% endblock %}
