{% load static %}

<header class="site-header">
    <nav class="navigation page-width" aria-label="Main navigation">
        <a class="brand" href="{% url 'core:home' %}" aria-label="{{ site_name }} home">
            <img class="brand-logo" src="{% static 'images/websitelogo.png' %}" alt="">
            <span class="brand-name">{{ site_name }}</span>
        </a>

        <div class="navigation-actions">
            <form class="navigation-search" action="{% url 'products:search' %}" method="get" role="search">
                <label class="sr-only" for="site-search">Search bags</label>
                <input id="site-search" type="search" name="q" placeholder="Search bags">
                <button type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </button>
            </form>

            <a class="header-action" href="{% url 'cart:wishlist' %}" aria-label="Wishlist">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.8 8.8c0 5.1-8.8 10-8.8 10s-8.8-4.9-8.8-10a4.5 4.5 0 0 1 8.8-1.4 4.5 4.5 0 0 1 8.8 1.4Z"></path>
                </svg>
                <span>Wishlist</span>
            </a>

            <a class="header-action" href="{% url 'cart:cart' %}" aria-label="Shopping bag">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 8h14l1 13H4L5 8Z"></path>
                    <path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
                </svg>
                <span>Bag</span>
            </a>

            {% if request.user.is_authenticated %}
                <a class="header-action account-icon-link" href="{% url 'accounts:account' %}" aria-label="My account">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path>
                    </svg>
                    <span class="sr-only">My account</span>
                </a>
            {% else %}
                <a class="header-action account-icon-link" href="{% url 'accounts:login' %}" aria-label="Account / Login">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path>
                    </svg>
                    <span>Account / Login</span>
                </a>
            {% endif %}
        </div>
    </nav>
</header>
