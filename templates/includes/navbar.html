{% load static %}
<header class="site-header">
    <nav class="navigation page-width" aria-label="Main navigation">
        <a class="brand" href="{% url 'core:home' %}" aria-label="{{ site_name }} home">
            <span class="brand-mark" aria-hidden="true">N</span>
            <span>{{ site_name }}</span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu">
            <span class="sr-only">Toggle navigation</span>
            <span class="menu-toggle-line"></span>
            <span class="menu-toggle-line"></span>
        </button>

        <div class="navigation-menu" id="primary-menu">
            <div class="navigation-links">
                <a href="{% url 'core:home' %}">Home</a>
                <a href="{% url 'core:shop' %}">Shop</a>
                <a href="{% url 'core:home' %}#categories">Categories</a>
            </div>

            <form class="navigation-search" action="{% url 'core:search' %}" method="get" role="search">
                <label class="sr-only" for="site-search">Search bags</label>
                <input id="site-search" type="search" name="q" placeholder="Find your everyday bag">
                <button type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
                </button>
            </form>

            <div class="navigation-actions">
                <a href="{% url 'core:wishlist' %}">Wishlist</a>
                <a href="{% url 'core:cart' %}">Bag</a>
                <a class="account-link" href="{% url 'core:account' %}">Account / Login</a>
            </div>
        </div>
    </nav>
</header>
