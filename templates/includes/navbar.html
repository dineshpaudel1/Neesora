{% load static %}

<header class="site-header" role="banner">
    <div class="site-nav page-width">
        <a class="nav-brand" href="{% url 'core:home' %}" aria-label="{{ site_name }} home">
            <img class="nav-logo" src="{% static 'images/websitelogo.png' %}" alt="">
            <span class="nav-name">{{ site_name|lower }}</span>
        </a>

        <nav class="nav-links" aria-label="Site navigation">
            <a href="{% url 'products:shop' %}" {% if request.path == '/shop/' or site_page_type == 'category' or site_page_type == 'product' %}aria-current="page"{% endif %}>Shop</a>
            <a href="{% url 'core:about' %}" {% if site_page_type == 'about' %}aria-current="page"{% endif %}>About</a>
        </nav>

        <div class="nav-actions">
            <button
                class="nav-icon-btn nav-search-btn"
                type="button"
                aria-label="Search"
                aria-controls="site-search"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 5 5"></path>
                </svg>
            </button>

            <a
                class="nav-icon-btn nav-bag"
                href="{% url 'cart:cart' %}"
                aria-label="Shopping bag{% if cart_item_count %}, {{ cart_item_count }} item{{ cart_item_count|pluralize }}{% endif %}"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 8h14l1 13H4L5 8Z"></path>
                    <path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
                </svg>
                {% if cart_item_count %}<span class="nav-bag-count" aria-hidden="true">{{ cart_item_count }}</span>{% endif %}
            </a>

            {% if request.user.is_authenticated %}
                <a class="nav-icon-btn" href="{% url 'accounts:account' %}" aria-label="My account">
            {% else %}
                <a class="nav-icon-btn" href="{% url 'accounts:login' %}" aria-label="Sign in">
            {% endif %}
                <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path>
                </svg>
            </a>

            <button
                class="nav-icon-btn nav-menu-btn"
                type="button"
                aria-controls="nav-mobile"
                aria-expanded="false"
                aria-label="Open menu"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18M3 12h18M3 18h18"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="search-panel" id="site-search" hidden>
        <form class="search-panel-form page-width" action="{% url 'products:search' %}" method="get" role="search">
            <label class="sr-only" for="site-search-input">Search bags</label>
            <input
                id="site-search-input"
                class="search-panel-input"
                type="search"
                name="q"
                value="{{ request.GET.q }}"
                placeholder="Search bags…"
            >
            <button type="submit" class="search-panel-btn" aria-label="Submit search">
                <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 5 5"></path>
                </svg>
            </button>
            <button type="button" class="search-panel-close" aria-label="Close search">
                <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18M6 6l12 12"></path>
                </svg>
            </button>
        </form>
    </div>

    <nav class="nav-mobile" id="nav-mobile" aria-label="Mobile navigation" hidden>
        <a href="{% url 'products:shop' %}">Shop all bags</a>
        <a href="{% url 'core:about' %}">About</a>
        <a href="{% url 'cart:wishlist' %}">Wishlist</a>
        {% if request.user.is_authenticated %}
            <a href="{% url 'accounts:account' %}">My account</a>
            <a href="{% url 'orders:orders' %}">My orders</a>
        {% else %}
            <a href="{% url 'accounts:login' %}">Sign in</a>
        {% endif %}
    </nav>
</header>
